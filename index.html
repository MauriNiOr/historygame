<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ninja Escape Arena - Escape Room + Combate</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    
    <!-- Pantalla de menú -->
    <div id="menu-screen" class="screen">
      <h1>🥷 NINJA ESCAPE ARENA</h1>
      <p class="subtitle">Escape Room + Combate 2D</p>
      <button id="btn-start">JUGAR</button>
      <button id="btn-levels">SELECCIONAR NIVEL</button>
      <div id="level-select" class="hidden">
        <button class="level-btn" data-level="1">Nivel 1</button>
        <button class="level-btn" data-level="2">Nivel 2</button>
        <button class="level-btn" data-level="3">Nivel 3</button>
        <button class="level-btn" data-level="4">Nivel 4</button>
        <button class="level-btn" data-level="5">Nivel 5</button>
        <button id="btn-back">← Volver</button>
      </div>
      <p class="controls">Controles: WASD / Flechas = Mover | Espacio = Atacar | E = Interactuar</p>
    </div>

    <!-- HUD -->
    <div id="hud" class="hidden">
      <div id="health-bar">
        <div id="health-fill"></div>
      </div>
      <div id="level-info">Nivel <span id="current-level">1</span></div>
      <div id="keys-info">🔑 <span id="keys-count">0</span></div>
      <div id="enemies-info">👾 <span id="enemies-count">0</span></div>
    </div>

    <!-- Pantalla de victoria / game over -->
    <div id="end-screen" class="screen hidden">
      <h2 id="end-title">¡Victoria!</h2>
      <p id="end-message"></p>
      <button id="btn-next">Siguiente Nivel</button>
      <button id="btn-menu">Menú Principal</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
